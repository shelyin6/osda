server:
  port: 8080

spring:
  application:
    name: osda
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB

osda:
  # Parser identifier written into every analysis result for traceability.
  parser-version: osda-parser/0.1.0
  # native: built-in recursive descent parser (default, fastest, tolerant of dialect drift);
  # antlr: vendored Oracle PL/SQL grammar (strict syntax check);
  # hybrid: grammar validation with automatic lenient fallback when the SQL has syntax errors.
  parser-engine: native
  # Maximum characters of the original SQL kept as evidence per relation.
  snippet-length: 400
  # Maximum depth allowed for upstream/downstream expansion.
  max-lineage-depth: 10
